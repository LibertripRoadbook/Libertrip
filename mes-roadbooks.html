<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Roadbooks — LIBERTRIP</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #000; --card: #0f0f0f; --border: rgba(255,255,255,0.07);
  --border-lg: rgba(255,255,255,0.12); --accent: #4F8EFF; --accent-2: #8B5CF6;
  --green: #34D399; --gold: #F5C842; --text: rgba(255,255,255,0.85);
  --text-muted: rgba(255,255,255,0.4);
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
h1,h2,h3 { font-family:'Syne',sans-serif; }

nav {
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 32px; border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.85); backdrop-filter:blur(20px);
}
.nav-logo {
  font-family:'Syne',sans-serif; font-weight:800; font-size:20px;
  background:linear-gradient(135deg,#fff 40%,#4f8eff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  text-decoration:none;
}
.nav-email { font-size:13px; color:var(--text-muted); }
.btn-logout {
  background:transparent; border:1px solid var(--border-lg);
  border-radius:8px; padding:7px 14px; color:var(--text-muted);
  cursor:pointer; font-size:13px; font-family:'DM Sans',sans-serif;
  transition:all 0.2s;
}
.btn-logout:hover { border-color:rgba(248,113,113,0.4); color:#F87171; }

main { max-width:800px; margin:0 auto; padding:48px 24px; }

.page-title { font-size:32px; font-weight:800; margin-bottom:8px; }
.page-sub { font-size:15px; color:var(--text-muted); margin-bottom:40px; }

.rb-grid { display:flex; flex-direction:column; gap:16px; }

.rb-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:18px; padding:24px 28px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  transition:border-color 0.2s, box-shadow 0.2s;
  text-decoration:none; color:inherit;
}
.rb-card:hover { border-color:var(--border-lg); box-shadow:0 4px 30px rgba(0,0,0,0.4); }

.rb-info { flex:1; min-width:0; }
.rb-dest { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rb-meta { font-size:13px; color:var(--text-muted); }

.rb-badge {
  display:inline-flex; align-items:center; gap:6px;
  border-radius:8px; padding:5px 12px; font-size:12px; font-weight:500; flex-shrink:0;
}
.rb-badge.paid    { background:rgba(52,211,153,0.1); border:1px solid rgba(52,211,153,0.2); color:var(--green); }
.rb-badge.pending { background:rgba(245,200,66,0.08); border:1px solid rgba(245,200,66,0.2); color:var(--gold); }

.rb-arrow { color:var(--text-muted); font-size:18px; flex-shrink:0; }

/* Login screen */
#login-screen {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; min-height:80vh; text-align:center; padding:24px;
}
.login-card {
  background:var(--card); border:1px solid var(--border);
  border-radius:24px; padding:48px 40px; max-width:440px; width:100%;
}
.login-title { font-size:28px; font-weight:800; margin-bottom:8px; }
.login-sub { font-size:15px; color:var(--text-muted); margin-bottom:32px; line-height:1.6; }
.login-input {
  width:100%; background:transparent; border:1px solid rgba(255,255,255,0.15);
  border-radius:12px; padding:16px 18px; color:#fff; font-size:15px;
  font-family:'DM Sans',sans-serif; outline:none; transition:border-color 0.2s;
  margin-bottom:14px;
}
.login-input:focus { border-color:var(--accent); }
.login-btn {
  width:100%; background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:none; border-radius:12px; padding:17px; color:#fff;
  font-family:'Syne',sans-serif; font-size:16px; font-weight:700;
  cursor:pointer; transition:opacity 0.2s;
}
.login-btn:hover { opacity:0.88; }
.login-btn:disabled { opacity:0.5; cursor:not-allowed; }
.login-success {
  display:none; background:rgba(52,211,153,0.07);
  border:1px solid rgba(52,211,153,0.2); border-radius:12px;
  padding:16px; color:var(--green); font-size:14px; line-height:1.6; margin-top:14px;
}
.login-error {
  display:none; background:rgba(248,113,113,0.07);
  border:1px solid rgba(248,113,113,0.2); border-radius:12px;
  padding:12px; color:#F87171; font-size:13px; margin-top:10px;
}

/* Empty state */
.empty-state { text-align:center; padding:64px 24px; }
.empty-icon { font-size:56px; margin-bottom:16px; }
.empty-title { font-family:'Syne',sans-serif; font-size:22px; font-weight:700; margin-bottom:8px; }
.empty-sub { font-size:15px; color:var(--text-muted); margin-bottom:28px; }
.btn-generate {
  display:inline-block; background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff; text-decoration:none; border-radius:100px;
  padding:14px 32px; font-family:'Syne',sans-serif; font-weight:700; font-size:15px;
}

/* Loader */
#loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; gap:16px; }
.loader { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

@media (max-width:600px) {
  nav { padding:14px 16px; }
  main { padding:32px 16px; }
  .rb-card { flex-direction:column; align-items:flex-start; }
  .login-card { padding:32px 24px; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">LIBERTRIP</a>
  <div style="display:flex;align-items:center;gap:12px;">
    <span class="nav-email" id="nav-email"></span>
    <button class="btn-logout" onclick="logout()" id="btn-logout" style="display:none">Déconnexion</button>
  </div>
</nav>

<!-- Loading -->
<div id="loading-screen">
  <div class="loader"></div>
  <div style="font-size:14px;color:var(--text-muted);">Chargement…</div>
</div>

<!-- Login -->
<div id="login-screen" style="display:none;">
  <div class="login-card">
    <div style="font-size:48px;margin-bottom:20px;">✈️</div>
    <div class="login-title">Accède à tes roadbooks</div>
    <div class="login-sub">Entre ton email et on t'envoie un lien magique — pas de mot de passe à retenir.</div>
    <input class="login-input" type="email" id="login-email" placeholder="ton@email.com" />
    <button class="login-btn" onclick="sendMagicLink()" id="login-btn">Recevoir mon lien →</button>
    <div class="login-success" id="login-success">
      ✉️ Lien envoyé ! Vérifie ta boîte mail et clique sur le lien pour accéder à tes roadbooks.
    </div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- Contenu -->
<main id="main-content" style="display:none;">
  <div class="page-title">Mes Roadbooks</div>
  <div class="page-sub" id="page-sub">Retrouve tous tes itinéraires générés.</div>
  <div class="rb-grid" id="rb-grid"></div>
</main>

<script>
// ── Supabase client (CDN) ────────────────────────────────────────────────────
// On utilise l'API directement sans SDK côté client pour garder le fichier léger.

let session = null;

function getStoredSession() {
  try { return JSON.parse(localStorage.getItem('libertrip_session') || 'null'); } catch { return null; }
}
function storeSession(s) {
  if (s) localStorage.setItem('libertrip_session', JSON.stringify(s));
  else    localStorage.removeItem('libertrip_session');
}

// ── Gestion du magic link (token dans l'URL) ─────────────────────────────────

async function handleMagicLinkCallback() {
  const hash   = window.location.hash;
  const params = new URLSearchParams(hash.replace('#', ''));
  const accessToken  = params.get('access_token');
  const refreshToken = params.get('refresh_token');

  if (accessToken) {
    session = { access_token: accessToken, refresh_token: refreshToken };
    storeSession(session);
    window.history.replaceState({}, '', window.location.pathname);
    return true;
  }
  return false;
}

async function sendMagicLink() {
  const email = document.getElementById('login-email').value.trim();
  const btn   = document.getElementById('login-btn');
  const succ  = document.getElementById('login-success');
  const err   = document.getElementById('login-error');

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    err.style.display = 'block';
    err.textContent   = 'Saisis un email valide.';
    return;
  }

  btn.disabled    = true;
  btn.textContent = '⏳ Envoi…';
  succ.style.display = 'none';
  err.style.display  = 'none';

  try {
    const res  = await fetch('/api/auth-magic-link', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ email }),
    });
    const data = await res.json();

    if (data.success) {
      succ.style.display = 'block';
      btn.textContent    = '✉️ Email envoyé';
    } else {
      err.style.display = 'block';
      err.textContent   = data.error || 'Erreur lors de l\'envoi.';
      btn.disabled      = false;
      btn.textContent   = 'Recevoir mon lien →';
    }
  } catch(e) {
    err.style.display = 'block';
    err.textContent   = 'Erreur réseau. Réessaie.';
    btn.disabled      = false;
    btn.textContent   = 'Recevoir mon lien →';
  }
}

async function loadRoadbooks() {
  if (!session?.access_token) return;

  document.getElementById('nav-email').textContent = '';
  document.getElementById('btn-logout').style.display = '';

  try {
    const res  = await fetch('/api/my-roadbooks', {
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    });
    const data = await res.json();

    if (!res.ok) {
      // Session expirée
      storeSession(null); session = null;
      showLoginScreen();
      return;
    }

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('main-content').style.display   = '';

    const grid = document.getElementById('rb-grid');
    if (!data.roadbooks || data.roadbooks.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🗺️</div>
          <div class="empty-title">Aucun roadbook pour l'instant</div>
          <div class="empty-sub">Génère ton premier itinéraire et il apparaîtra ici.</div>
          <a href="/" class="btn-generate">✦ Générer mon voyage</a>
        </div>`;
      return;
    }

    grid.innerHTML = data.roadbooks.map(rb => {
      const date   = new Date(rb.created_at).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
      const badge  = rb.payment_status === 'paid'
        ? '<span class="rb-badge paid">✅ Complet</span>'
        : '<span class="rb-badge pending">🔒 Aperçu</span>';
      return `
        <a class="rb-card" href="${rb.url}">
          <div class="rb-info">
            <div class="rb-dest">${rb.destination}</div>
            <div class="rb-meta">${rb.days} jours · Généré le ${date}</div>
          </div>
          ${badge}
          <div class="rb-arrow">→</div>
        </a>`;
    }).join('');

  } catch(e) {
    console.error('[mes-roadbooks]', e);
    showLoginScreen();
  }
}

function showLoginScreen() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('login-screen').style.display   = '';
}

function logout() {
  storeSession(null);
  session = null;
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('btn-logout').style.display   = 'none';
  document.getElementById('nav-email').textContent      = '';
  showLoginScreen();
}

// ── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  const fromMagicLink = await handleMagicLinkCallback();
  if (!fromMagicLink) {
    session = getStoredSession();
  }

  if (session?.access_token) {
    await loadRoadbooks();
  } else {
    showLoginScreen();
  }
}

document.addEventListener('DOMContentLoaded', init);

// Enter pour envoyer le magic link
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
    sendMagicLink();
  }
});
</script>
</body>
</html>
