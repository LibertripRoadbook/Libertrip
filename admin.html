<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIBERTRIP — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --black: #000; --card: #0f0f0f; --border: rgba(255,255,255,0.07);
  --accent: #4F8EFF; --accent-2: #8B5CF6; --gold: #F5C842;
  --green: #34D399; --red: #F87171; --text: rgba(255,255,255,0.85);
  --muted: rgba(255,255,255,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--black); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

/* Login */
#login-screen {
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:24px;
}
.login-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:28px;
  background:linear-gradient(135deg,#fff 40%,#4f8eff); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent; background-clip:text; }
.login-box { background:var(--card); border:1px solid var(--border); border-radius:20px;
  padding:36px 40px; display:flex; flex-direction:column; gap:16px; width:360px; }
.login-box h2 { font-family:'Syne',sans-serif; font-size:20px; text-align:center; }
.login-input { background:rgba(255,255,255,0.04); border:1px solid var(--border);
  border-radius:10px; padding:14px 16px; color:#fff; font-family:'DM Sans',sans-serif;
  font-size:15px; outline:none; transition:border-color 0.2s; }
.login-input:focus { border-color:rgba(79,142,255,0.4); }
.login-btn { background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border:none; border-radius:10px; padding:14px; font-family:'Syne',sans-serif;
  font-size:15px; font-weight:700; color:#fff; cursor:pointer; }
.login-error { color:var(--red); font-size:13px; text-align:center; display:none; }

/* Dashboard */
#dashboard { display:none; }

nav { background:rgba(0,0,0,0.9); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border); padding:16px 32px;
  display:flex; align-items:center; justify-content:space-between; }
.nav-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:18px;
  background:linear-gradient(135deg,#fff 40%,#4f8eff); -webkit-background-clip:text;
  -webkit-text-fill-color:transparent; background-clip:text; }
.nav-label { font-size:12px; color:var(--muted); }

.container { max-width:1280px; margin:0 auto; padding:32px 24px; }

/* Stats row */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; }
.stat-value { font-family:'Syne',sans-serif; font-size:36px; font-weight:800; letter-spacing:-1px; }
.stat-label { font-size:13px; color:var(--muted); margin-top:4px; }
.stat-card.green { border-color:rgba(52,211,153,0.2); }
.stat-card.green .stat-value { color:var(--green); }
.stat-card.gold  { border-color:rgba(245,200,66,0.2); }
.stat-card.gold  .stat-value { color:var(--gold); }
.stat-card.blue  { border-color:rgba(79,142,255,0.2); }
.stat-card.blue  .stat-value { color:var(--accent); }

/* Filters */
.filters { display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap; }
.filter-btn { background:rgba(255,255,255,0.04); border:1px solid var(--border);
  border-radius:8px; padding:8px 16px; color:var(--muted); font-size:13px; cursor:pointer;
  font-family:'DM Sans',sans-serif; transition:all 0.2s; }
.filter-btn.active, .filter-btn:hover { border-color:var(--accent); color:var(--accent);
  background:rgba(79,142,255,0.08); }
.search-input { background:rgba(255,255,255,0.04); border:1px solid var(--border);
  border-radius:8px; padding:8px 16px; color:#fff; font-family:'DM Sans',sans-serif;
  font-size:13px; outline:none; width:220px; }
.search-input:focus { border-color:rgba(79,142,255,0.3); }
.refresh-btn { margin-left:auto; background:rgba(79,142,255,0.08); border:1px solid rgba(79,142,255,0.2);
  border-radius:8px; padding:8px 16px; color:var(--accent); font-size:13px; cursor:pointer;
  font-family:'DM Sans',sans-serif; }

/* Table */
.table-wrap { background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { padding:14px 16px; text-align:left; font-size:11px; font-weight:500;
  letter-spacing:2px; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--border); white-space:nowrap; }
tbody tr { border-bottom:1px solid rgba(255,255,255,0.03); transition:background 0.15s; }
tbody tr:last-child { border-bottom:none; }
tbody tr:hover { background:rgba(255,255,255,0.02); }
tbody td { padding:12px 16px; vertical-align:top; }

.status-badge { display:inline-flex; align-items:center; gap:5px;
  border-radius:6px; padding:3px 10px; font-size:11px; font-weight:500; white-space:nowrap; }
.status-badge.pending  { background:rgba(245,200,66,0.1); color:var(--gold); border:1px solid rgba(245,200,66,0.2); }
.status-badge.paid     { background:rgba(52,211,153,0.1); color:var(--green); border:1px solid rgba(52,211,153,0.2); }
.status-badge.refunded { background:rgba(248,113,113,0.1); color:var(--red); border:1px solid rgba(248,113,113,0.2); }

.email-cell { font-weight:500; color:#fff; }
.dest-cell  { color:var(--accent); font-weight:500; }
.muted-cell { color:var(--muted); }
.date-cell  { color:var(--muted); white-space:nowrap; font-size:12px; }
.link-cell a { color:var(--accent-2); text-decoration:none; font-size:12px; }
.link-cell a:hover { text-decoration:underline; }

/* Expand row */
.expand-row { background:rgba(255,255,255,0.01); }
.expand-row td { padding:0; }
.expand-content { padding:16px 20px; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.expand-item { display:flex; flex-direction:column; gap:3px; }
.expand-label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
.expand-value { font-size:13px; color:rgba(255,255,255,0.7); }

/* Pagination */
.pagination { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:20px; }
.page-btn { background:rgba(255,255,255,0.04); border:1px solid var(--border);
  border-radius:8px; padding:8px 14px; color:var(--muted); font-size:13px;
  cursor:pointer; font-family:'DM Sans',sans-serif; }
.page-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
.page-btn:disabled { opacity:0.3; cursor:not-allowed; }
.page-info { font-size:13px; color:var(--muted); }

/* Loading */
.table-loading { text-align:center; padding:48px; color:var(--muted); }
.spinner { display:inline-block; width:24px; height:24px; border:2px solid var(--border);
  border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Export */
.export-btn { background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.2);
  border-radius:8px; padding:8px 16px; color:var(--green); font-size:13px;
  cursor:pointer; font-family:'DM Sans',sans-serif; }

@media(max-width:900px) {
  .stats-row { grid-template-columns:1fr 1fr; }
  table { font-size:12px; }
}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-logo">LIBERTRIP</div>
  <div class="login-box">
    <h2>🔒 Accès Admin</h2>
    <input class="login-input" type="password" id="secret-input"
      placeholder="Mot de passe admin..."
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Accéder au dashboard</button>
    <div class="login-error" id="login-error">Mot de passe incorrect.</div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <nav>
    <span class="nav-logo">LIBERTRIP <span style="font-size:13px;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400;"> Admin</span></span>
    <div style="display:flex;align-items:center;gap:16px;">
      <span class="nav-label" id="last-refresh"></span>
      <button onclick="doLogout()" style="background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;">Déconnexion</button>
    </div>
  </nav>

  <div class="container">

    <!-- Stats -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card blue">
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-label">Formulaires soumis</div>
      </div>
      <div class="stat-card green">
        <div class="stat-value" id="stat-paid">—</div>
        <div class="stat-label">Conversions payées</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-value" id="stat-revenue">—</div>
        <div class="stat-label">Revenus estimés</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-rate">—</div>
        <div class="stat-label">Taux de conversion</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Tous</button>
      <button class="filter-btn" onclick="setFilter('pending',this)">En attente</button>
      <button class="filter-btn" onclick="setFilter('paid',this)">Payés ✅</button>
      <button class="filter-btn" onclick="setFilter('refunded',this)">Remboursés</button>
      <input class="search-input" type="text" id="search-input" placeholder="🔍 Chercher email, destination..."
        oninput="onSearch(this.value)">
      <button class="export-btn" onclick="exportCSV()">⬇️ Export CSV</button>
      <button class="refresh-btn" onclick="loadData()">↻ Actualiser</button>
    </div>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Destination</th>
            <th>Jours</th>
            <th>Véhicule</th>
            <th>Rythme</th>
            <th>Statut</th>
            <th>Date</th>
            <th>Roadbook</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="9" class="table-loading"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <button class="page-btn" id="btn-prev" onclick="changePage(-1)">← Précédent</button>
      <span class="page-info" id="page-info"></span>
      <button class="page-btn" id="btn-next" onclick="changePage(1)">Suivant →</button>
    </div>

  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let adminSecret = '';
let currentPage = 1;
let currentFilter = 'all';
let currentSearch = '';
let searchTimeout = null;
let allRows = [];   // cache local pour export CSV

const LIMIT = 50;
const PRICE = 14.99;

// ── Auth ─────────────────────────────────────────────────────────────────────
function doLogin() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) return;
  adminSecret = val;
  // Tenter un appel pour valider le secret
  loadData(true);
}

function doLogout() {
  adminSecret = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('secret-input').value = '';
}

// ── Data loading ─────────────────────────────────────────────────────────────
async function loadData(isLoginCheck = false) {
  document.getElementById('table-body').innerHTML =
    '<tr><td colspan="9" class="table-loading"><div class="spinner"></div></td></tr>';

  const params = new URLSearchParams({
    secret: adminSecret,
    page:   currentPage,
    limit:  LIMIT,
  });
  if (currentFilter !== 'all') params.set('status', currentFilter);

  try {
    const res  = await fetch('/api/admin?' + params.toString());
    const data = await res.json();

    if (res.status === 401 || data.error) {
      if (isLoginCheck) {
        document.getElementById('login-error').style.display = 'block';
        adminSecret = '';
      } else {
        alert('Session expirée. Reconnecte-toi.');
        doLogout();
      }
      document.getElementById('table-body').innerHTML = '';
      return;
    }

    // Login OK
    if (isLoginCheck) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = '';
      document.getElementById('login-error').style.display = 'none';
    }

    allRows = data.rows || [];
    renderStats(data);
    renderTable(data.rows || [], data.total, data.page);
    document.getElementById('last-refresh').textContent =
      'Mis à jour ' + new Date().toLocaleTimeString('fr-FR');

  } catch (err) {
    document.getElementById('table-body').innerHTML =
      '<tr><td colspan="9" class="table-loading" style="color:var(--red);">Erreur de connexion au serveur.</td></tr>';
  }
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats(data) {
  const rows  = data.rows || [];
  const total = data.total || 0;
  const paid  = rows.filter(r => r.payment_status === 'paid').length;
  const rate  = total > 0 ? Math.round((paid / total) * 100) : 0;
  const rev   = (paid * PRICE).toFixed(2);

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-paid').textContent  = paid;
  document.getElementById('stat-revenue').textContent = rev + '€';
  document.getElementById('stat-rate').textContent    = rate + '%';
}

// ── Table rendering ───────────────────────────────────────────────────────────
function renderTable(rows, total, page) {
  const body = document.getElementById('table-body');

  // Filtre côté client sur la recherche
  const search = currentSearch.toLowerCase();
  const filtered = search
    ? rows.filter(r =>
        r.email.toLowerCase().includes(search) ||
        (r.destination || '').toLowerCase().includes(search))
    : rows;

  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="9" class="table-loading">Aucun résultat.</td></tr>';
    return;
  }

  body.innerHTML = filtered.map((r, i) => {
    const statusClass = r.payment_status;
    const statusLabel = { pending:'⏳ En attente', paid:'✅ Payé', refunded:'↩️ Remboursé' }[r.payment_status] || r.payment_status;
    const date = r.created_at ? new Date(r.created_at).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';

    return `
      <tr onclick="toggleExpand(${i})" style="cursor:pointer;">
        <td class="email-cell">${esc(r.email)}</td>
        <td class="dest-cell">${esc(r.destination)}</td>
        <td class="muted-cell">${r.days}j</td>
        <td class="muted-cell">${esc(r.vehicle)}</td>
        <td class="muted-cell">${esc(r.rhythm)}</td>
        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
        <td class="date-cell">${date}</td>
        <td class="link-cell"><a href="${r.roadbook_url}" target="_blank">Voir →</a></td>
        <td class="muted-cell" style="font-size:11px;">▼</td>
      </tr>
      <tr class="expand-row" id="expand-${i}" style="display:none;">
        <td colspan="9">
          <div class="expand-content">
            <div class="expand-item"><div class="expand-label">Compagnon</div><div class="expand-value">${esc(r.companion)}</div></div>
            <div class="expand-item"><div class="expand-label">Nourriture</div><div class="expand-value">${esc(r.food)}</div></div>
            <div class="expand-item"><div class="expand-label">Hébergement</div><div class="expand-value">${esc(r.accommodation)}</div></div>
            <div class="expand-item"><div class="expand-label">Intérêts</div><div class="expand-value">${esc(r.interests)}</div></div>
            <div class="expand-item"><div class="expand-label">Départ</div><div class="expand-value">${esc(r.departure_place)} ${r.departure_date || ''}</div></div>
            <div class="expand-item"><div class="expand-label">UUID</div><div class="expand-value" style="font-size:11px;color:var(--muted);">${r.id}</div></div>
          </div>
        </td>
      </tr>`;
  }).join('');

  // Pagination
  const pageCount = Math.ceil(total / LIMIT);
  document.getElementById('page-info').textContent  = `Page ${page} / ${pageCount || 1} — ${total} entrée(s)`;
  document.getElementById('btn-prev').disabled = page <= 1;
  document.getElementById('btn-next').disabled = page >= pageCount;
}

function toggleExpand(i) {
  const el = document.getElementById('expand-' + i);
  if (!el) return;
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

// ── Filters ───────────────────────────────────────────────────────────────────
function setFilter(val, btn) {
  currentFilter = val;
  currentPage   = 1;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadData();
}

function onSearch(val) {
  clearTimeout(searchTimeout);
  currentSearch = val;
  searchTimeout = setTimeout(() => renderTable(allRows, allRows.length, currentPage), 200);
}

function changePage(delta) {
  currentPage = Math.max(1, currentPage + delta);
  loadData();
}

// ── Export CSV ────────────────────────────────────────────────────────────────
function exportCSV() {
  const headers = ['Email','Destination','Jours','Véhicule','Compagnon','Rythme','Nourriture','Hébergement','Intérêts','Départ','Statut','Date','URL Roadbook'];
  const rows = allRows.map(r => [
    r.email, r.destination, r.days, r.vehicle, r.companion, r.rhythm,
    r.food, r.accommodation, r.interests, r.departure_place,
    r.payment_status, r.created_at,
    'https://' + window.location.host + r.roadbook_url
  ].map(v => '"' + String(v || '').replace(/"/g, '""') + '"').join(','));

  const csv  = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'libertrip_soumissions_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function esc(str) {
  if (!str) return '—';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('secret-input').focus();
</script>
</body>
</html>
